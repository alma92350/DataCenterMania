<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0f15" />
    <meta name="description" content="DataCenterMania: run a data center, dispatch technicians, beat the alarms. Free browser game for desktop and mobile." />
    <title>DataCenterMania</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body class="at-start">
    <div id="app">
      <header id="topbar" aria-label="Status"></header>
      <main id="stage">
        <canvas id="map" aria-label="Data center floor map. Tap a rack to open it."></canvas>
        <div id="zoom" class="zoom" aria-label="Map controls">
          <button data-zoom="in" aria-label="Zoom in">＋</button>
          <button data-zoom="out" aria-label="Zoom out">－</button>
          <button data-zoom="fit" aria-label="Fit map">⤢</button>
          <button data-zoom="heat" aria-label="Map overlay: heat, power, off (H)" title="Overlay: heat → power → off (H / P)">🌡️</button>
        </div>
        <div id="goalbar" class="goalbar"></div>
        <div id="buildbar"></div>
        <div id="tip"></div>
        <div id="toasts" aria-live="polite"></div>
      </main>
      <aside id="sidebar">
        <section id="panel"></section>
        <nav id="tabs" aria-label="Panels"></nav>
      </aside>
      <div id="modal" hidden></div>
      <div id="screen"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
